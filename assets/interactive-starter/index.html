<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A live Manim number line</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
  :root { color-scheme: dark; background: #000; color: #f5f3ef; font-family: Georgia, serif; }
  body { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.8rem); }
  p { line-height: 1.5; }
  #scene { width: 100%; min-height: 220px; }
  canvas { display: block; max-width: 100%; }
  fieldset { border: 1px solid #555; padding: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
  button, input, output { font: 1rem ui-monospace, monospace; }
  button { padding: .55rem 1rem; cursor: pointer; }
  input { max-width: 100%; }
  :focus-visible { outline: 2px solid #ffff80; outline-offset: 4px; }
  #status { min-height: 3rem; }
</style>
<main>
  <h1>Move a point. Keep its value.</h1>
  <p>Choose a position and watch the point move along the number line.</p>
  <div id="scene" role="img" aria-label="Animated point on a number line from zero to four"></div>
  <form id="controls">
    <fieldset id="actions">
      <legend>Point position</legend>
      <label for="position">Target</label>
      <input id="position" type="range" min="0" max="4" value="0" step="1">
      <output id="target" for="position">0</output>
      <button type="submit">Move point</button>
      <button type="button" id="reset">Reset</button>
    </fieldset>
  </form>
  <p id="status" aria-live="polite">Current position: 0.</p>
</main>
<script type="module" src="./main.js"></script>
</html>
